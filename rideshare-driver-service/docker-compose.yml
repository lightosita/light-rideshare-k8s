
services:
  # 1. Migration Service
  driver-migrate:
    build: .  
    image: swiftride-driver
    command: node dist/migrations/createTable.js
    env_file:
      - .env
    restart: "no"
    networks:
      - swiftride-net

  driver-service:
    build: . 
    image: swiftride-driver
    container_name: driver-service
    ports:
      - "3003:3003"
    env_file:
      - .env
    networks:
      - swiftride-net

networks:
  swiftride-net:
    external: true