version: "3.9"

services:
  frontend:
    build: .
    image: swiftride-frontend
    container_name: swiftride-frontend
    ports:
      - "3000:3000"  
    env_file:
      - .env
    networks:
      - swiftride-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  swiftride-net:
    external: true
